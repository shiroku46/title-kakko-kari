name: One-time Foundation Bootstrap Finalize

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-time-foundation-bootstrap-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'shiroku46/title-kakko-kari'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require scoped Bootstrap token
        shell: bash
        env:
          BOOTSTRAP_WORKFLOW_TOKEN: ${{ secrets.BOOTSTRAP_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BOOTSTRAP_WORKFLOW_TOKEN" ]; then
            echo "::error::Repository Secret BOOTSTRAP_WORKFLOW_TOKEN is required for the one-time final synchronization."
            exit 1
          fi

      - name: Check out Bootstrap candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation/bootstrap-foundation
          fetch-depth: 0
          token: ${{ secrets.BOOTSTRAP_WORKFLOW_TOKEN }}

      - name: Merge current main and retain Bootstrap workflow deletion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          merge_status=0
          git merge --no-commit --no-ff origin/main || merge_status=$?

          unmerged=$(git diff --name-only --diff-filter=U)
          if [ -n "$unmerged" ]; then
            test "$unmerged" = ".github/workflows/bootstrap-foundation.yml"
          fi

          rm -f .github/workflows/bootstrap-foundation.yml
          git add -A

          if git diff --cached --quiet && [ "$merge_status" -eq 0 ]; then
            echo "Candidate branch already contains current main and deletes the temporary workflow."
            exit 0
          fi

          git commit -m "chore: synchronize Bootstrap branch with current main"
          git push origin HEAD:refs/heads/automation/bootstrap-foundation
