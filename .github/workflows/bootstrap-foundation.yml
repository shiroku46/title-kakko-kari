name: One-time Foundation Bootstrap Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-time-foundation-bootstrap-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'shiroku46/title-kakko-kari'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require scoped Bootstrap token
        shell: bash
        env:
          BOOTSTRAP_WORKFLOW_TOKEN: ${{ secrets.BOOTSTRAP_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BOOTSTRAP_WORKFLOW_TOKEN" ]; then
            echo "::error::Repository Secret BOOTSTRAP_WORKFLOW_TOKEN is required for the one-time workflow repair."
            exit 1
          fi

      - name: Check out Bootstrap candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation/bootstrap-foundation
          fetch-depth: 0
          token: ${{ secrets.BOOTSTRAP_WORKFLOW_TOKEN }}

      - name: Make Claude Queue verification target-safe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/claude-queue.yml')
          text = path.read_text(encoding='utf-8')
          old = '''      - run: python scripts/public_export_guard.py .
                - run: python scripts/validate_repository.py
                - run: python -m unittest discover -s tests
          '''
          # The triple-quoted indentation above follows Python source indentation;
          # normalize it to the exact YAML block before matching.
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '''      - name: Run distributed validation and target-owned tests
                shell: bash
                run: |
                  set -euo pipefail
                  python -m compileall -q scripts
                  python scripts/public_export_guard.py .
                  python scripts/validate_repository.py
                  if [ -d tests ]; then
                    python -m unittest discover -s tests
                  else
                    echo "No target-owned tests/ directory; distributed validation completed."
                  fi
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one Claude Queue verification block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Enforce exact repair scope and push
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          test "$changed" = ".github/workflows/claude-queue.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/claude-queue.yml
          git commit -m "fix: make Claude Queue verification target-safe"
          git push origin HEAD:refs/heads/automation/bootstrap-foundation
