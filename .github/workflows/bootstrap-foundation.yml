name: One-time Foundation Bootstrap Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-time-foundation-bootstrap-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'shiroku46/title-kakko-kari'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require scoped Bootstrap token
        shell: bash
        env:
          BOOTSTRAP_WORKFLOW_TOKEN: ${{ secrets.BOOTSTRAP_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BOOTSTRAP_WORKFLOW_TOKEN" ]; then
            echo "::error::Repository Secret BOOTSTRAP_WORKFLOW_TOKEN is required for the one-time workflow repair."
            exit 1
          fi

      - name: Check out Bootstrap candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation/bootstrap-foundation
          fetch-depth: 0
          token: ${{ secrets.BOOTSTRAP_WORKFLOW_TOKEN }}

      - name: Correct Claude Queue verification block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/claude-queue.yml')
          text = path.read_text(encoding='utf-8')
          old = (
              "      - name: Run distributed validation and target-owned tests\n"
              "      shell: bash\n"
              "      run: |\n"
              "        set -euo pipefail\n"
              "        python -m compileall -q scripts\n"
              "        python scripts/public_export_guard.py .\n"
              "        python scripts/validate_repository.py\n"
              "        if [ -d tests ]; then\n"
              "python -m unittest discover -s tests\n"
              "        else\n"
              "echo \"No target-owned tests/ directory; distributed validation completed.\"\n"
              "        fi\n"
          )
          new = (
              "      - name: Run distributed validation and target-owned tests\n"
              "        shell: bash\n"
              "        run: |\n"
              "          set -euo pipefail\n"
              "          python -m compileall -q scripts\n"
              "          python scripts/public_export_guard.py .\n"
              "          python scripts/validate_repository.py\n"
              "          if [ -d tests ]; then\n"
              "            python -m unittest discover -s tests\n"
              "          else\n"
              "            echo \"No target-owned tests/ directory; distributed validation completed.\"\n"
              "          fi\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one malformed Claude Queue block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Enforce exact repair scope and push
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          test "$changed" = ".github/workflows/claude-queue.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/claude-queue.yml
          git commit -m "fix: correct Claude Queue verification indentation"
          git push origin HEAD:refs/heads/automation/bootstrap-foundation
