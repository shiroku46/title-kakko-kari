name: Foundation Upgrade Generator

on:
  push:
    branches: [github/issue-31-foundation-upgrade]
    paths:
      - .github/workflows/foundation-upgrade-runner.yml

permissions: {}

env:
  BASE_SHA: fa8a81efc9298f68325b4a8c57c920be17f4e7fe
  SOURCE_SHA: c2b747b720552137d9d02efd96a692a97699afcc
  TARGET_REPOSITORY: shiroku46/title-kakko-kari

jobs:
  generate:
    if: github.repository == 'shiroku46/title-kakko-kari' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: github/issue-31-foundation-upgrade
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Generate and verify exact upgrade payload
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_WORKFLOW_B64: 
        run: |
          set -euo pipefail
          test "$(gh api "repos/$TARGET_REPOSITORY/commits/main" --jq .sha)" = "$BASE_SHA"
          source_root="$RUNNER_TEMP/foundation"
          baseline="$RUNNER_TEMP/baseline"
          candidate="$RUNNER_TEMP/candidate"
          payload="$RUNNER_TEMP/payload"
          mkdir -p "$source_root" "$baseline" "$candidate" "$payload/files"
          git init "$source_root"
          git -C "$source_root" remote add origin https://github.com/shiroku46/ai-dev-automation-foundation.git
          git -C "$source_root" fetch --depth=1 origin "$SOURCE_SHA"
          git -C "$source_root" checkout --detach FETCH_HEAD
          test "$(git -C "$source_root" rev-parse HEAD)" = "$SOURCE_SHA"
          tar --exclude=.git -cf - . | tar -xf - -C "$baseline"
          rm -f "$baseline/.github/workflows/foundation-upgrade-runner.yml"
          tar -C "$baseline" -cf - . | tar -xf - -C "$candidate"
          SOURCE_ROOT="$source_root" CANDIDATE_ROOT="$candidate" python - <<'PY'
          import base64
          import json
          import os
          import sys
          from pathlib import Path

          source = Path(os.environ["SOURCE_ROOT"])
          target = Path(os.environ["CANDIDATE_ROOT"])
          sys.path.insert(0, str(source))
          from bootstrap.generator import (
              MANAGED_FILES,
              PRESERVE_IF_PRESENT,
              TARGET_OWNED_FILES,
              render,
          )

          authorized = [
              path
              for path in MANAGED_FILES
              if (target / path).exists()
              and path not in PRESERVE_IF_PRESENT
              and path not in TARGET_OWNED_FILES
          ]
          if (target / "INSTALL_CHECKLIST.md").exists():
              authorized.append("INSTALL_CHECKLIST.md")
          plan = render(
              target,
              "shiroku46",
              mode="existing-product",
              source_sha=os.environ["SOURCE_SHA"],
              installed_at="2026-08-05T19:48:00Z",
              authorize_overwrite=authorized,
          )
          if not plan.is_safe:
              raise SystemExit(f"unsafe Bootstrap plan: {plan.collisions}")

          config = {
              "checks": [
                  {
                      "name": "Product CI",
                      "workflow": ".github/workflows/product-ci.yml",
                  }
              ],
              "schema_version": 1,
          }
          (target / ".github/foundation-product-checks.json").write_text(
              json.dumps(config, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (target / ".github/workflows/product-ci.yml").write_bytes(
              base64.b64decode(os.environ["PRODUCT_WORKFLOW_B64"], validate=True)
          )
          PY
          rm -f \
            "$candidate/scripts/ai_recovery_supervisor.py" \
            "$candidate/scripts/supervisor_final_guard.py" \
            "$candidate/scripts/supervisor_runtime.py" \
            "$candidate/scripts/supervisor_queue_recovery.py" \
            "$candidate/scripts/supervisor_queue_recovery_v2.py" \
            "$candidate/scripts/supervisor_queue_recovery_v3.py" \
            "$candidate/.github/workflows/foundation-upgrade-runner.yml"
          cd "$candidate"
          ruby -e 'require "psych"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |path| documents = Psych.parse_stream(File.read(path)).children; raise "#{path}: expected one YAML document" unless documents.length == 1 }'
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          python scripts/foundation_drift.py --root .
          python -m unittest discover -s tests
          (
            cd client
            npm ci
            npm run build:web
          )
          (
            cd server
            npm ci
            node --check src/index.js
          )
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -rf client/node_modules client/dist client/.expo server/node_modules
          cd "$GITHUB_WORKSPACE"
          SOURCE_ROOT="$source_root" BASELINE_ROOT="$baseline" CANDIDATE_ROOT="$candidate" PAYLOAD_ROOT="$payload" python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          source_root = Path(os.environ["SOURCE_ROOT"])
          baseline = Path(os.environ["BASELINE_ROOT"])
          candidate = Path(os.environ["CANDIDATE_ROOT"])
          payload = Path(os.environ["PAYLOAD_ROOT"])
          repo = os.environ["TARGET_REPOSITORY"]
          sys.path.insert(0, str(source_root))
          from bootstrap.generator import MANAGED_FILES, PRESERVE_IF_PRESENT

          retired = {
              "scripts/ai_recovery_supervisor.py",
              "scripts/supervisor_final_guard.py",
              "scripts/supervisor_runtime.py",
              "scripts/supervisor_queue_recovery.py",
              "scripts/supervisor_queue_recovery_v2.py",
              "scripts/supervisor_queue_recovery_v3.py",
          }
          allowed = (set(MANAGED_FILES) - set(PRESERVE_IF_PRESENT)) | retired | {
              "FOUNDATION.lock.json",
              "INSTALL_CHECKLIST.md",
              ".github/workflows/product-ci.yml",
          }

          def inventory(root: Path):
              result = {}
              for path in root.rglob("*"):
                  if path.is_symlink():
                      raise SystemExit(f"symlink is not allowed: {path}")
                  if path.is_file():
                      relative = path.relative_to(root).as_posix()
                      result[relative] = hashlib.sha256(path.read_bytes()).hexdigest()
              return result

          def pages(path: str):
              completed = subprocess.run(
                  ["gh", "api", "--paginate", "--slurp", path],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              if completed.returncode != 0:
                  raise SystemExit("GitHub read request failed")
              value = json.loads(completed.stdout)
              if not isinstance(value, list):
                  raise SystemExit("GitHub pagination is malformed")
              return value

          old = inventory(baseline)
          new = inventory(candidate)
          changed = sorted(path for path in new if old.get(path) != new[path])
          deleted = sorted(path for path in old if path not in new)
          all_changes = set(changed) | set(deleted)
          unexpected = sorted(all_changes - allowed)
          if unexpected:
              raise SystemExit(f"upgrade escaped authorized paths: {unexpected}")

          for page in pages(f"repos/{repo}/pulls?state=open&per_page=100"):
              for pr in page if isinstance(page, list) else []:
                  if not isinstance(pr, dict) or not isinstance(pr.get("number"), int):
                      continue
                  paths = set()
                  for files_page in pages(
                      f"repos/{repo}/pulls/{pr['number']}/files?per_page=100"
                  ):
                      for item in files_page if isinstance(files_page, list) else []:
                          if isinstance(item, dict) and isinstance(
                              item.get("filename"), str
                          ):
                              paths.add(item["filename"])
                          if isinstance(item, dict) and isinstance(
                              item.get("previous_filename"), str
                          ):
                              paths.add(item["previous_filename"])
                  overlap = sorted(all_changes & paths)
                  if overlap:
                      raise SystemExit(
                          f"upgrade overlaps open PR #{pr['number']}: {overlap}"
                      )

          entries = []
          for relative in changed:
              source = candidate / relative
              destination = payload / "files" / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
              entries.append(
                  {
                      "path": relative,
                      "sha256": hashlib.sha256(source.read_bytes()).hexdigest(),
                      "size": source.stat().st_size,
                  }
              )
          manifest = {
              "schema_version": 1,
              "repository": repo,
              "base_sha": os.environ["BASE_SHA"],
              "foundation_source_sha": os.environ["SOURCE_SHA"],
              "changed_files": entries,
              "deleted_paths": deleted,
              "human_action_required": False,
          }
          (payload / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
          test "$(gh api "repos/$TARGET_REPOSITORY/commits/main" --jq .sha)" = "$BASE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-upgrade-issue-31-${{ github.run_id }}
          path: ${{ runner.temp }}/payload
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  blobs:
    needs: generate
    if: needs.generate.result == 'success' && github.repository == 'shiroku46/title-kakko-kari' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: shiroku46/title-kakko-kari
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: foundation-upgrade-issue-31-${{ github.run_id }}
          path: ${{ runner.temp }}/payload
      - name: Create content-addressed blobs only
        env:
          PAYLOAD_ROOT: ${{ runner.temp }}/payload
          MAP_ROOT: ${{ runner.temp }}/map
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          payload = Path(os.environ["PAYLOAD_ROOT"])
          output = Path(os.environ["MAP_ROOT"])
          output.mkdir(parents=True)
          manifest = json.loads(
              (payload / "manifest.json").read_text(encoding="utf-8")
          )
          mapping = []
          for item in manifest["changed_files"]:
              raw = (payload / "files" / item["path"]).read_bytes()
              if (
                  len(raw) != item["size"]
                  or hashlib.sha256(raw).hexdigest() != item["sha256"]
              ):
                  raise SystemExit(f"payload digest mismatch: {item['path']}")
              completed = subprocess.run(
                  [
                      "gh",
                      "api",
                      "--method",
                      "POST",
                      f"repos/{repo}/git/blobs",
                      "--input",
                      "-",
                  ],
                  input=json.dumps(
                      {
                          "content": base64.b64encode(raw).decode("ascii"),
                          "encoding": "base64",
                      },
                      separators=(",", ":"),
                  ),
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              if completed.returncode != 0:
                  raise SystemExit("GitHub blob request failed")
              value = json.loads(completed.stdout)
              if not isinstance(value, dict) or not isinstance(value.get("sha"), str):
                  raise SystemExit("GitHub blob response is malformed")
              mapping.append({"path": item["path"], "sha": value["sha"]})
          result = {
              "schema_version": 1,
              "repository": repo,
              "base_sha": manifest["base_sha"],
              "foundation_source_sha": manifest["foundation_source_sha"],
              "mapping": mapping,
              "deleted_paths": manifest["deleted_paths"],
              "human_action_required": False,
          }
          (output / "blob-map.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-upgrade-blob-map-31-${{ github.run_id }}
          path: ${{ runner.temp }}/map
          if-no-files-found: error
          retention-days: 1
